# Docker Compose override for standalone self-signed SSL mode
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d
#   make start ARGS="--ssl"

services:
  nginx:
    ports:
      - "${DOCKERCART_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/ssl:/etc/ssl/dockercart:ro
      - ./docker/nginx/ssl/dockercart.selfsigned.conf:/etc/nginx/conf.d/dockercart.ssl.conf:ro

  # TLS is terminated in front of the app in this mode, so the app MUST emit
  # https:// URLs: when it keeps an http base URL, config_ssl (which builds
  # every image/logo/asset URL on an https page) stays http and the browser
  # reports mixed content + "Not secure". Literal on purpose — the mode is
  # authoritative, so a stale DOCKERCART_SSL_ENABLED=false in an existing .env
  # cannot switch TLS URL generation off again.
  apache:
    environment:
      - DOCKERCART_SSL_ENABLED=true
  scheduler:
    environment:
      - DOCKERCART_SSL_ENABLED=true
