name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  syntax:
    name: PHP Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Lint
        run: |
          find upload -type f -name "*.php" ! -path 'upload/config.php' ! -path 'upload/admin/config.php' -print0 \
            | xargs -0 -P4 php -l -n

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: mbstring

      - name: Cache Composer & PHPStan
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer/files
            ./.cache
          key: phpstan-${{ hashFiles('**/composer.lock') }}
          restore-keys: phpstan-

      - name: Install PHPStan
        run: composer install --no-interaction

      - name: Run PHPStan
        run: ./storage/vendor/bin/phpstan analyze -a ./storage/vendor/autoload.php --no-progress --memory-limit=512M

  cs-fixer:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2, cs2pr
          extensions: mbstring

      - name: Cache Composer & CS-Fixer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer/files
            ./.php-cs-fixer.cache
          key: cs-fixer-${{ runner.os }}-${{ github.sha }}
          restore-keys: cs-fixer-${{ runner.os }}-

      - name: Install PHP-CS-Fixer
        run: composer require --dev --no-interaction -w php-cs-fixer/shim ^3.95

      - name: Run PHP-CS-Fixer
        run: |
          ./storage/vendor/bin/php-cs-fixer fix --dry-run --diff --format=checkstyle > /tmp/cs-report.xml || true
          cs2pr --graceful-warnings /tmp/cs-report.xml

  deploy-config:
    name: Deploy Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          set -e
          for f in docker/entrypoint.sh docker/manticore/entrypoint.sh docker/mysql/init.sh \
                   docker/mysql/install-indexes.sh scripts/*.sh start.sh update.sh health-check.sh \
                   install-backup-cron.sh install-cli.sh setup-letsencrypt.sh; do
            if [ -f "$f" ]; then
              bash -n "$f" && echo "OK: $f"
            fi
          done

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -x docker/entrypoint.sh docker/manticore/entrypoint.sh \
            docker/mysql/init.sh scripts/run-migrations.sh start.sh update.sh \
            health-check.sh install-backup-cron.sh

      - name: Compose validation (base mode)
        run: docker compose -f docker-compose.yml config --quiet

      - name: Compose validation (traefik modes)
        run: |
          docker compose -f docker-compose.traefik.yml config --quiet
          docker compose -f docker-compose.traefik.yml -f docker-compose.traefik.ssl.yml config --quiet
          docker compose -f docker-compose.traefik.yml -f docker-compose.traefik.le.yml config --quiet

      - name: Compose validation (standalone SSL modes)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ssl.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.le.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.mariadb-port.yml config --quiet

