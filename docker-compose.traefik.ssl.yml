# Docker Compose override for Traefik self-signed SSL mode
# Usage: docker compose -f docker-compose.traefik.yml -f docker-compose.traefik.ssl.yml up -d

services:
  nginx:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${DOCKERCART_ROUTER_NAME:-dockercart}.rule=Host(`${DOCKERCART_DOMAIN:-dockercart.local}`)"
      - "traefik.http.routers.${DOCKERCART_ROUTER_NAME:-dockercart}.entrypoints=websecure"
      - "traefik.http.routers.${DOCKERCART_ROUTER_NAME:-dockercart}.tls=true"
      - "traefik.http.routers.${DOCKERCART_ROUTER_NAME:-dockercart}.tls.certresolver=selfsigned"
      - "traefik.http.services.${DOCKERCART_ROUTER_NAME:-dockercart}.loadbalancer.server.port=80"

  # TLS is terminated in front of the app in this mode, so the app MUST emit
  # https:// URLs: when it keeps an http base URL, config_ssl (which builds
  # every image/logo/asset URL on an https page) stays http and the browser
  # reports mixed content + "Not secure". Literal on purpose — the mode is
  # authoritative, so a stale DOCKERCART_SSL_ENABLED=false in an existing .env
  # cannot switch TLS URL generation off again.
  apache:
    environment:
      - DOCKERCART_SSL_ENABLED=true
  scheduler:
    environment:
      - DOCKERCART_SSL_ENABLED=true
