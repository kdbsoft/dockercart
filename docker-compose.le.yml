# Docker Compose override for standalone LE (Let's Encrypt) SSL mode
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.le.yml up -d
# Requirements:
#   - SSL_DOMAIN and SSL_EMAIL in .env
#   - Public inbound ports 80 and 443

services:
  nginx:
    ports:
      - "${DOCKERCART_HTTPS_PORT:-443}:443"
    volumes:
      - ${LETSENCRYPT_DATA_DIR:-./docker/letsencrypt}:/etc/letsencrypt:ro
      - ${LETSENCRYPT_WEBROOT_DIR:-./docker/letsencrypt/www}:/var/www/certbot:ro
      - ./docker/nginx/ssl/dockercart.ssl.conf:/etc/nginx/conf.d/dockercart.ssl.conf:ro
    # Periodic reload so renewed certificates are picked up without a
    # container restart. Reload with an unchanged cert is harmless.
    # Reloading more often than certbot's renew interval guarantees the new
    # cert goes live within RENEW_NGINX_RELOAD_INTERVAL of the renewal.
    #
    # The image entrypoint runs /docker-entrypoint.d/* (which renders
    # /etc/nginx/templates/nginx.conf.template — proxy_cache_path and
    # limit_req_zone zones conf.d relies on — and exports NGINX_LOCAL_RESOLVERS)
    # ONLY when its first argument is "nginx" or "nginx-debug". A bare
    # "sh -c ..." command skips it, so nginx would start with the stock image
    # config and die on the undefined zones. Validate the config once (this
    # renders the template), then start the reload loop and exec nginx as
    # PID 1 so restart semantics stay intact.
    command:
      - /bin/sh
      - -c
      - |
        /docker-entrypoint.sh nginx -t || exit 1
        while :; do sleep "${RENEW_NGINX_RELOAD_INTERVAL:-6h}"; nginx -s reload; done &
        exec nginx -g "daemon off;"

  certbot:
    image: certbot/certbot:latest
    container_name: ${CERTBOT_CONTAINER_NAME:-${COMPOSE_PROJECT_NAME:-dockercart}_certbot}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      - nginx
    volumes:
      - ${LETSENCRYPT_DATA_DIR:-./docker/letsencrypt}:/etc/letsencrypt
      - ${LETSENCRYPT_WEBROOT_DIR:-./docker/letsencrypt/www}:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM; while :; do
          # No deploy-hook: the certbot image has no nginx and no docker CLI.
          # nginx picks up renewed certs via its own periodic reload loop.
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep "${CERTBOT_RENEW_INTERVAL:-24h}";
        done
    networks:
      - dockercart-network
