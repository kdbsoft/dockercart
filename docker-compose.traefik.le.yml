# Docker Compose override for Traefik LE (Let's Encrypt) SSL mode
# Usage: docker compose -f docker-compose.traefik.yml -f docker-compose.traefik.le.yml up -d
# Traefik terminates TLS and runs its own ACME client: only DOCKERCART_DOMAIN
# (the router Host rule) is needed — set its DNS A/AAAA record to this host.
#
# The resolver name must match a `certificatesResolvers.<name>` entry in the
# EXTERNAL Traefik's static config. Default is `letsencrypt` (Traefik's own docs
# default); set TRAEFIK_CERTRESOLVER in .env when your Traefik names its ACME
# resolver differently — otherwise the router never gets a certificate and
# Traefik serves its default self-signed one (Cloudflare then reports 526).
# start.sh checks the name against the running Traefik before starting.

services:
  nginx:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${DOCKERCART_ROUTER_NAME:-dockercart}.rule=Host(`${DOCKERCART_DOMAIN:-dockercart.local}`)"
      - "traefik.http.routers.${DOCKERCART_ROUTER_NAME:-dockercart}.entrypoints=websecure"
      - "traefik.http.routers.${DOCKERCART_ROUTER_NAME:-dockercart}.tls=true"
      - "traefik.http.routers.${DOCKERCART_ROUTER_NAME:-dockercart}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${DOCKERCART_ROUTER_NAME:-dockercart}.loadbalancer.server.port=80"

  # TLS is terminated in front of the app in this mode, so the app MUST emit
  # https:// URLs: when it keeps an http base URL, config_ssl (which builds
  # every image/logo/asset URL on an https page) stays http and the browser
  # reports mixed content + "Not secure". Literal on purpose — the mode is
  # authoritative, so a stale DOCKERCART_SSL_ENABLED=false in an existing .env
  # cannot switch TLS URL generation off again.
  apache:
    environment:
      - DOCKERCART_SSL_ENABLED=true
  scheduler:
    environment:
      - DOCKERCART_SSL_ENABLED=true
