user nginx;
worker_processes auto;
worker_rlimit_nofile 4096;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$ab_cf_clearance" "$ab_block"';

    access_log /var/log/nginx/access.log main;

    # Performance optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Connection optimization
    keepalive_requests 100;
    reset_timedout_connection on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/json application/xml+rss 
               application/rss+xml image/svg+xml font/truetype font/opentype 
               application/vnd.ms-fontobject;
    gzip_disable "msie6";

    # Proxy cache for static files
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/dynamic levels=1:2 keys_zone=dynamic_cache:10m max_size=50m inactive=10m use_temp_path=off;

    # Proxy temp path for buffered responses (must be writable by nginx user)
    proxy_temp_path /var/cache/nginx/proxy_temp;

    # Upstream connection settings (required for keepalive)
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Proxy buffer sizes for larger responses (2MB total = can fit 1.5MB file without temp)
    proxy_buffer_size 16k;
    proxy_buffers 16 128k;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # Preserve the original request scheme forwarded by Traefik so the app can
    # set Secure cookies behind the proxy; falls back to the scheme nginx saw.
    map $http_x_forwarded_proto $x_forwarded_proto {
        default $scheme;
        https https;
        http http;
    }

    # HSTS only for HTTPS traffic (empty string = header not sent).
    map $x_forwarded_proto $hsts_header {
        https "max-age=31536000";
        default "";
    }

    # ==========================================================
    # Anti-bot heuristic: "cold" catalog-filter hits -> 403.
    # ==========================================================
    # Bots generate combinatorial filter URLs (e.g. ?...&dcf=N) and fire
    # them directly, burning PHP/DB cycles. A human applying a filter
    # always navigates from another page of the same site (Referer host
    # equals the request host). Heuristic, NOT an auth boundary: Referer,
    # Host and User-Agent are client-controlled — it only kills the
    # dumb-bot flood cheaply, before it reaches Apache/PHP.

    # Catalog-filter argument present in the query string. Extend the
    # alternation if new crawlable state params appear; add only params
    # that never appear in direct/bookmarked traffic (sort/limit/page are
    # legit from Google results — do NOT add those).
    map $args $ab_cold_param {
        default 0;
        "~(^|&)dcf=" 1;
    }

    # Hostname part of the Referer ("" when absent or not a URL).
    map $http_referer $ab_ref_host {
        default "";
        "~*^https?://(?<ref_host>[^/:]+)" $ref_host;
    }

    # Internal Referer = its host equals the request host. Domain-agnostic
    # (PCRE backreference "same:same"): works for any vhost, www/non-www
    # and staging clones without editing this config.
    map "$ab_ref_host:$host" $ab_ref_internal {
        default 0;
        "~*^(.+):\1$" 1;
    }

    # Browser-like User-Agent. Covers address-bar links, messenger in-app
    # browsers and WebViews (all contain Chrome/Safari/Gecko/Edg/Opera
    # markers). Flood bots use curl/wget/python-requests/Java/Go — none
    # match. A bot spoofing a Chrome UA still passes here and must be
    # handled by rate limiting (limit_req zones below).
    map $http_user_agent $ab_browser_ua {
        default 0;
        "~*(firefox|chrome|safari|edg|opr/|gecko)" 1;
    }

    # Returning user holds an app session (F5 / bookmarked filtered page).
    map $http_cookie $ab_session {
        default 0;
        "~*(^|; )OCSESSID=" 1;
    }

    # Diagnostics only: did the client pass the Cloudflare challenge?
    # Always 0 when the site is not behind Cloudflare. Written to the
    # access log, never used for enforcement.
    map $http_cookie $ab_cf_clearance {
        default 0;
        "~*cf_clearance=" 1;
    }

    # Let's Encrypt HTTP-01 path is exempt from all bot heuristics. Belt
    # and braces: the ^~ acme-challenge location already wins over regex
    # locations, but a server-level if (see snippets/antibot-block.conf)
    # runs in the rewrite phase BEFORE location selection, so the
    # exemption must exist here too.
    map $uri $ab_acme {
        default 0;
        "~^/\.well-known/acme-challenge/" 1;
    }

    # Final decision. Blocked iff: filter arg AND no internal Referer AND
    # no session cookie AND non-browser UA AND not the ACME path.
    # Enforced by snippets/antibot-block.conf included in every server
    # block; to dry-run, comment out the if there — $ab_block keeps being
    # logged for audit.
    map "$ab_cold_param:$ab_ref_internal:$ab_session:$ab_browser_ua:$ab_acme" $ab_block {
        default 0;
        "1:0:0:0:0" 1;
    }

    # Upstream to Apache
    upstream apache {
        server apache:80;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
