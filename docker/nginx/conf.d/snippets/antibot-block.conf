# Anti-bot: "cold" catalog-filter hits -> 403 (maps in nginx.conf).
# Included by every server block (port 80 / standalone LE / self-signed).
#
# Dry-run mode: comment out the if below. $ab_block keeps being written
# to the access log (last field), so blocked populations can be audited
# without enforcing.
if ($ab_block) {
    return 403;
}
