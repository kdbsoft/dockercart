# DockerCart Nginx Configuration
# Acts as reverse proxy to Apache + serves static files with caching

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Logging
    access_log /var/log/nginx/dockercart_access.log main;
    error_log /var/log/nginx/dockercart_error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "same-origin" always;

    # NOTE: Rate limiting is NOT applied globally here.
    # It is applied only to PHP/dynamic locations below to avoid 503 errors
    # when a browser makes many simultaneous static-asset requests (Ctrl+F5).

    # Let's Encrypt HTTP-01 challenge (used in standalone SSL mode)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
        access_log off;
    }

    # Canonicalize URLs with duplicate slashes in path (e.g. ////electronics-1)
    # Use normalized $uri for target while preserving query string.
    if ($request_uri ~ "^([^?]*//+[^?]*)(\\?.*)?$") {
        return 301 $scheme://$host$uri$is_args$args;
    }

    # ======================
    # STATIC FILES (proxied to Apache)
    # ======================
    #
    # Images/CSS/JS/fonts are proxied to Apache because rootless Podman with
    # user-namespace mapping and :ro bind-mounts can prevent the nginx user from
    # reading host files directly (EACCES 13). Apache's entrypoint sets correct
    # ownership (www-data), so static files are served reliably through Apache.
    # Nginx still applies caching headers and can be extended with proxy_cache.

    # Images - cache 30 days
    location ~* \.(jpg|jpeg|png|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        proxy_pass http://apache;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }

    # CSS, JS - cache 30 days
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        proxy_pass http://apache;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }

    # Fonts - cache 90 days
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 90d;
        add_header Cache-Control "public, immutable";
        access_log off;

        proxy_pass http://apache;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }

    # Media - cache 7 days
    location ~* \.(mp4|webm|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";

        proxy_pass http://apache;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    }

    # ======================
    # DENY SENSITIVE PATHS
    # ======================

    location ~ /\. {
        deny all;
        access_log off;
    }

    location ~ /config/ {
        deny all;
    }

    # Explicit deny for root-level generated config files. The regex above
    # matches "/config/" (with a slash) but not "/config.php" or
    # "/admin/config.php", so those would otherwise be proxied to Apache and
    # executed. Block them explicitly at the web root.
    location = /config.php {
        deny all;
        access_log off;
    }

    location = /admin/config.php {
        deny all;
        access_log off;
    }

    location ~ /storage/ {
        deny all;
    }

    location ~ /system/ {
        deny all;
    }

    # CLI tools and mock scripts are executed via php-cli inside the container
    # only — never through the web server.
    location ^~ /bin/ {
        deny all;
        access_log off;
    }

    location ^~ /admin/cli/ {
        deny all;
        access_log off;
    }

    # ======================
    # PROXY TO APACHE
    # ======================

    # Admin paths -> Apache (hardened security headers)
    location ^~ /admin/ {
        limit_req zone=admin burst=100 nodelay;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_pass http://apache;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # PHP under /image is never legitimate (upload/FTP area) — deny before the
    # generic .php proxy below (nginx uses the first matching regex).
    location ~ ^/image/.*\.(php|phtml|phar|php[3-8])$ {
        deny all;
        access_log off;
    }

    # PHP requests -> Apache (rate-limited: dynamic content)
    location ~ \.php$ {
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://apache;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Dynamic requests -> Apache
    location ~* \.(html|htm)$ {
        proxy_pass http://apache;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;

        # Cache HTML for 1 minute
        proxy_cache static_cache;
        proxy_cache_valid 200 1m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
    }

    # Default: proxy to Apache (rate-limited: catches all remaining dynamic requests)
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass http://apache;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;

        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ======================
    # HEALTH CHECK
    # ======================
    # Proxies to Apache's healthcheck.php so container health reflects the
    # real application state (DB + storage + cache), not just nginx itself.
    location /health {
        access_log off;
        proxy_pass http://apache/healthcheck.php;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
        proxy_set_header X-Healthcheck-Token $http_x_healthcheck_token;
    }
}
